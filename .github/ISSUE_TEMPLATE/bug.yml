name: Bug
description: Something does not work, or breaks.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in About, for example 0.11.0-prealpha.
    validations:
      required: true
  - type: dropdown
    id: computer
    attributes:
      label: Computer
      options: [Linux, Windows, macOS (Apple Silicon), macOS (Intel)]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do before it happened?
      description: Step by step, as far as you remember.
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: A screenshot or the text of an error message helps.
